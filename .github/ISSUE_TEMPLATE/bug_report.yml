name: Bug report
description: Something in field-notes doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps or a repository that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: field-notes version
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser and version, Node version, framework/bundler, OS.
