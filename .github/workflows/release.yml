name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions: {}

# Four jobs, so that the OIDC token npm trusts is never held while anything is
# installed or built: `select` decides what to do, `version` opens the release
# PR, `pack` installs, builds and packs, and `publish` (the only job with
# `id-token: write`) publishes those tarballs with pnpm and a dependency-free
# script, installing nothing.
jobs:
  select:
    # Off until the maintainer sets the RELEASE_ENABLED repository variable to
    # "true", so early pushes to main can't publish a placeholder to npm. Every
    # other job needs this one, so they're off too.
    if: github.repository == 'deanbot/field-notes' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # `version` while changesets are pending, `publish` while a version
      # isn't on npm yet, otherwise `none`.
      - id: select
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: 'chore: release'
          commit-message: 'chore: release'

  pack:
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Tarballs of the versions not on npm yet, and a publish-plan.json that
      # names each one with its sha256.
      - run: pnpm exec changeset pack --out-dir "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pack
          path: ${{ runner.temp }}/pack
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: pack
    runs-on: ubuntu-latest
    # No `environment:` here: npm's trusted publisher for this package names
    # this workflow with no environment, and won't match a run that has one.
    permissions:
      # Tags and GitHub releases.
      contents: write
      # npm trusted publishing: npm trusts this job's OIDC token, so no npm
      # token is stored anywhere. It signs the provenance too.
      id-token: write
    env:
      # Publish with provenance. pnpm 12 reads this from PNPM_CONFIG_PROVENANCE
      # only, and an NPM_CONFIG_PROVENANCE beside it turns it off again.
      PNPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm's own binary, with no cache: nothing is installed in this job.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No registry-url: it writes an .npmrc with a placeholder token,
          # which would stand in front of trusted publishing.
          node-version-file: .nvmrc
      # pnpm publishes and does the OIDC exchange itself from 12.14.0 (the
      # version checked to have it), not npm.
      - name: Check pnpm can publish through trusted publishing
        run: |
          version="$(pnpm --version)"
          echo "pnpm $version"
          node -e "const [a, b] = process.argv[1].split('.').map(Number); process.exit(a > 12 || (a === 12 && b >= 14) ? 0 : 1)" "$version"
      # A release without provenance can't get it back: stop instead.
      - name: Check provenance is on
        run: test "$(pnpm config get provenance)" = true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pack
          path: ${{ runner.temp }}/pack
      # Checks each tarball against the plan, publishes it unless it's on npm
      # already, then tags and releases it as changesets does.
      - run: node scripts/publish-packed.ts "$RUNNER_TEMP/pack"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
